<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Esfera de Mérito — Renault Master 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#eef1f4;font-family:Arial,sans-serif}
#info{position:fixed;z-index:5;left:14px;top:14px;background:rgba(255,255,255,.94);border-radius:14px;padding:10px 13px;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:13px}
#info b{display:block;font-size:15px;margin-bottom:3px}#info span{color:#666}
#help{position:fixed;z-index:5;right:14px;bottom:14px;background:rgba(0,0,0,.68);color:#fff;border-radius:12px;padding:8px 10px;font-size:12px}
canvas{display:block}
</style>
</head>
<body>
<div id="info"><b>Esfera de Mérito</b><span>Renault Master L2H2 · 3D interativo</span></div>
<div id="help">Arrasta para rodar · Pinça para zoom</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf0f2f4);
scene.add(new THREE.HemisphereLight(0xffffff,0x5f6872,2.4));
const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(5,9,7);scene.add(key);
const rim=new THREE.DirectionalLight(0xffffff,1.5);rim.position.set(-6,5,-8);scene.add(rim);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
camera.position.set(8,4.5,10);

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,1.55,0);controls.minDistance=5;controls.maxDistance=18;
controls.maxPolarAngle=Math.PI*.48;controls.minPolarAngle=.65;

const van=new THREE.Group();scene.add(van);
const white=new THREE.MeshStandardMaterial({color:0xf7f7f5,roughness:.58,metalness:.02});
const black=new THREE.MeshStandardMaterial({color:0x111214,roughness:.82});
const dark=new THREE.MeshStandardMaterial({color:0x25282b,roughness:.65});
const glass=new THREE.MeshPhysicalMaterial({color:0x172126,roughness:.16,metalness:.08,transmission:.05});
const gold=new THREE.MeshStandardMaterial({color:0xE5A823,roughness:.34,metalness:.25});

function box(w,h,d,mat,x,y,z,bevel=0.08){
 const g=new THREE.BoxGeometry(w,h,d,1,1,1);
 const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);van.add(m);return m;
}
function cyl(r,depth,mat,x,y,z,rot=[Math.PI/2,0,0]){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,depth,32),mat);m.position.set(x,y,z);m.rotation.set(...rot);van.add(m);return m;
}

// Main L2H2 body, simplified high-detail presentation geometry
box(5.7,2.75,2.25,white,0,2.05,0);
box(1.55,2.55,2.23,white,-2.65,2.05,0);
box(3.95,.22,2.30,black,.15,.75,0);
box(5.25,.16,.18,black,0,.78,1.13);
box(5.25,.16,.18,black,0,.78,-1.13);
box(.24,1.65,2.30,black,2.82,1.35,0);
box(.12,2.1,2.28,black,-2.88,1.45,0);

// roof crown / cab transition
box(1.9,.42,2.22,white,-2.25,3.63,0);
box(1.72,1.0,2.24,white,-2.48,3.15,0);
box(1.45,.9,2.25,white,-2.66,2.95,0);

// windshield and side windows
box(.07,.95,1.78,glass,-3.05,3.02,0);
box(.08,.78,.82,glass,-2.92,3.0,.71);
box(.08,.78,.82,glass,-2.92,3.0,-.71);

// front grille/lights
box(.08,.55,1.25,dark,-3.08,1.55,0);
box(.08,.25,.5,white,-3.13,2.0,.72);
box(.08,.25,.5,white,-3.13,2.0,-.72);
box(.08,.13,.9,black,-3.14,1.33,0);

// mirrors
box(.28,.35,.22,black,-2.25,2.65,1.28);
box(.28,.35,.22,black,-2.25,2.65,-1.28);

// wheels
for(const x of [-1.85,1.85]) for(const z of [-1.18,1.18]){
 cyl(.58,.28,black,x,.78,z,[Math.PI/2,0,0]);
 cyl(.29,.30,dark,x,.78,z,[Math.PI/2,0,0]);
 cyl(.13,.32,gold,x,.78,z,[Math.PI/2,0,0]);
}

// rear twin doors
box(.98,2.45,.035,white,2.72,2.05,.59);
box(.98,2.45,.035,white,2.72,2.05,-.59);
box(.055,1.7,.045,black,2.18,1.92,.59);
box(.055,1.7,.045,black,2.18,1.92,-.59);

// handles + slider rail
box(.25,.08,.08,black,.72,2.3,1.16);
box(.25,.08,.08,black,.72,2.3,-1.16);
box(2.0,.055,.055,black,.75,2.55,1.17);
box(2.0,.055,.055,black,.75,2.55,-1.17);

// Canvas decal textures
function decal(lines,side){
 const c=document.createElement('canvas');c.width=1024;c.height=512;
 const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
 x.font='bold 58px Arial';x.fillStyle='#111';x.textAlign=side==='right'?'right':'left';
 let px=side==='right'?970:54, y=75;
 x.fillText('ESFERA DE MÉRITO',px,y);y+=62;
 x.fillStyle='#E5A823';x.fillRect(side==='right'?650:54,y-42,280,5);
 x.fillStyle='#111';x.font='bold 34px Arial';
 for(const t of lines){y+=45;x.fillText(t,px,y)}
 x.font='bold 30px Arial';y=390;x.fillText('+351 939 410 853',px,y);
 x.font='26px Arial';y+=35;x.fillText('esferademerito@gmail.com',px,y);
 y+=34;x.fillText('esferademerito.com',px,y);y+=34;x.fillText('@esferademerito',px,y);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
const sideTex=decal(['Construção civil','Remodelação / Restauro','Pinturas exterior / Interior','Serviços gerais'],'right');
const sideMat=new THREE.MeshBasicMaterial({map:sideTex,transparent:true});
const sidePlane=new THREE.Mesh(new THREE.PlaneGeometry(2.25,1.12),sideMat);
sidePlane.position.set(.35,2.25,1.145);sidePlane.rotation.y=0;van.add(sidePlane);
const sidePlane2=sidePlane.clone();sidePlane2.position.z=-1.145;sidePlane2.rotation.y=Math.PI;van.add(sidePlane2);

const rearTex=decal(['• Construção civil','• Remodelação / Restauro','• Pinturas exterior / Interior','• Serviços gerais'],'left');
const rearMat=new THREE.MeshBasicMaterial({map:rearTex,transparent:true});
const rearPlane=new THREE.Mesh(new THREE.PlaneGeometry(1.65,.95),rearMat);
rearPlane.position.set(2.705,2.2,.61);rearPlane.rotation.y=Math.PI/2;van.add(rearPlane);
const rearPlane2=rearPlane.clone();rearPlane2.position.z=-.61;rearPlane2.rotation.y=-Math.PI/2;van.add(rearPlane2);

// ES badge on front/rear
function badge(){
 const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');
 x.clearRect(0,0,512,512);x.textAlign='center';x.font='bold 220px Arial';
 x.fillStyle='#111';x.fillText('E',190,280);x.fillStyle='#E5A823';x.fillText('S',320,280);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
 return new THREE.Mesh(new THREE.PlaneGeometry(.8,.8),new THREE.MeshBasicMaterial({map:t,transparent:true}));
}
const b1=badge();b1.position.set(2.75,3.25,.63);b1.rotation.y=Math.PI/2;van.add(b1);
const b2=b1.clone();b2.position.z=-.63;b2.rotation.y=-Math.PI/2;van.add(b2);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0xdfe3e7,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=.18;scene.add(ground);

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
</body></html>
